<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='JavaScript.js') }}"></script>

  </head>

  <body>
    <div class="sidebar">
      <nav class="navbar">
        <div class="nav-item" onclick="window.location.href='{{ url_for('app.dashboard') }}'">
          <img class="icon" src="{{ url_for('static', filename='Resource/home.svg') }}" alt="home" />
          <span class="label">Home</span>
        </div>

        <div class="nav-item" onclick="window.location.href='{{ url_for('app.challenge') }}'">
          <img class="icon" src="{{ url_for('static', filename='Resource/chalange.svg') }}" alt="Challenges" />
          <span class="label">Challenges</span>
        </div>

        <div class="nav-item">
          <img
            class="icon"
            src="{{ url_for('static', filename='Resource/notifications.svg') }}"
            alt="Read"
          />
          <span class="label">Notifications</span>
        </div>
      </nav>

      <button class="toggle-btn" id="toggleBtn">❯</button>
    </div>
    <div class="mobile-header-bar">
      <button, id="burgermenu" class="burgermenu-btn">
        <img
          class="icon"
          src="{{ url_for('static', filename='Resource/burgermenu.svg') }}"
          alt="closemenu"
        />
      </button>
    </div>
    <div class="mobile-navbar">
      <div class="nav-item" onclick="window.location.href='{{ url_for('app.dashboard')}}'">
        <img
          class="icon"
          src="{{ url_for('static', filename='Resource/home.svg') }}"
          alt="home"
        />
        <span class="label">Home</span>
      </div>

      <div
        class="nav-item">
        <img
          class="icon"
          src="{{ url_for('static', filename='Resource/chalange.svg') }}"
          alt="Challenges"
        />
        <span class="label">Challenges</span>
      </div>

      <div class="nav-item">
        <img
          class="icon"
          src="{{ url_for('static', filename='Resource/group.svg') }}"
          alt="Group"
        />
        <span class="label">Group</span>
      </div>

      <div class="nav-item">
        <img
          class="icon"
          src="{{ url_for('static', filename='Resource/notifications.svg') }}"
          alt="Read"
        />
        <span class="label">Notifications</span>
      </div>
    </div>
    <script>
      const burgerMenu = document.getElementById("burgermenu");
      const mobileNavbar = document.querySelector(".mobile-navbar");

      burgerMenu.addEventListener("click", () => {
        if (mobileNavbar.classList.contains("open")) {
          mobileNavbar.classList.remove("open");
          mobileNavbar.style.display = "none";
        } else {
          mobileNavbar.classList.add("open");
          mobileNavbar.style.display = "flex";
        }
      });
    </script>
    <script>
      const toggle = document.getElementById("toggleBtn");
      const navbar = document.getElementsByClassName("navbar")[0];
      const nav_item = document.getElementsByClassName("nav-item");

      toggle.addEventListener("click", () => {
        navbar.classList.toggle("closed");
        if (navbar.classList.contains("closed")) {
          navbar.style.width = "60px";
        } else {
          navbar.style.width = "200px";
        }
      });
    </script>
    <div class="body-frame">
      <div class="dashboard-card">
        <header class="dashboard-header">
          <div class="header-left">
            <h1 id="co2e-message">Challenges & Groups</h1>
          </div>
          <div class="header-right">
            <button class="profile-icon">👤</button>
          </div>
        </header>

        <div class="badge-message">
          <p>Select based on the categories</p>
        </div>
        <!-- <div class="tabs-container">
          <button class="tab active" data-tab="all">All</button>
          <button class="tab" data-tab="current">Current</button>
          <button class="tab" data-tab="history">History</button>
          <button class="tab" data-tab="personal">Personal</button>
          <button class="tab" data-tab="group">Group</button>
          <button class="tab" data-tab="join">Join</button>
        </div> -->
      </div>
      <script>
        // Tab functionality
        let currentFilter = 'all';
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", function () {
            document
              .querySelectorAll(".tab")
              .forEach((t) => t.classList.remove("active"));
            this.classList.add("active");
            currentFilter = this.dataset.tab;
            renderChallenges();
          });
        });
      </script>

      <div class="section">
        <div class="section-header moderating-header">
          <h2>Available Challenges</h2>
        </div>
        <div class="moderating-body">
          <table class="moderating-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Start</th>
                <th>End</th>
                <th>Rules</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="challenges-list">
              <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="spacer"></div>

      <!-- Groups Section -->
      <div class="section">
        <div class="section-header moderating-header">
          <h2>Groups</h2>
        </div>
        <div class="moderating-body">

          <!-- Create Group -->
          <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
            <input type="text" id="new-group-name" placeholder="Enter group name" style="padding: 10px 14px; border: 2px solid #ccc; border-radius: 20px; font-size: 14px; width: 250px;">
            <button class="review-button" id="create-group-btn" style="font-size: 14px; padding: 8px 24px;">Create Group</button>
          </div>

          <!-- Groups Table -->
          <table class="moderating-table">
            <thead>
              <tr>
                <th>Group Name</th>
                <th>Members</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="groups-list">
              <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="spacer"></div>

      <script>
        // Groups functionality
        window.addEventListener('load', loadGroups);

        async function loadGroups() {
          try {
            const response = await fetch('/user_access/get_all_groups', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({})
            });
            const groups = await response.json();
            renderGroups(groups);
          } catch (error) {
            console.error('Failed to load groups:', error);
            document.getElementById('groups-list').innerHTML =
              '<tr><td colspan="3" style="text-align: center;">Failed to load groups</td></tr>';
          }
        }

        function renderGroups(groups) {
          const tbody = document.getElementById('groups-list');
          if (groups.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No groups yet</td></tr>';
            return;
          }
          tbody.innerHTML = '';
          groups.forEach(group => {
            const row = document.createElement('tr');
            let actionHtml;
            if (group.is_member) {
              actionHtml = '<span style="color: #1D9E75; font-weight: bold;">Member</span>';
              if (group.is_owner) {
                actionHtml += ' <span style="color: #888;">(Owner)</span>';
              } else {
                actionHtml += ` <button class="review-button leave-group-btn" data-id="${group.group_id}" style="font-size: 12px; padding: 4px 14px; background: #D85A30;">Leave</button>`;
              }
            } else {
              actionHtml = `<button class="review-button join-group-btn" data-id="${group.group_id}" style="font-size: 14px; padding: 8px 24px;">Join</button>`;
            }
            row.innerHTML = `
              <td>${group.group_name}</td>
              <td>${group.member_count}</td>
              <td>${actionHtml}</td>
            `;
            tbody.appendChild(row);
          });

          document.querySelectorAll('.join-group-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const groupId = parseInt(btn.dataset.id);
              try {
                const res = await fetch('/user_access/join_group', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ group_id: groupId })
                });
                const data = await res.json();
                if (res.ok) { alert(data.message); loadGroups(); }
                else { alert('Error: ' + (data.error || 'Failed to join group')); }
              } catch (err) { alert('Failed to join group.'); }
            });
          });

          document.querySelectorAll('.leave-group-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const groupId = parseInt(btn.dataset.id);
              try {
                const res = await fetch('/user_access/leave_group', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ group_id: groupId })
                });
                const data = await res.json();
                if (res.ok) { alert(data.message); loadGroups(); }
                else { alert('Error: ' + (data.error || 'Failed to leave group')); }
              } catch (err) { alert('Failed to leave group.'); }
            });
          });
        }

        document.getElementById('create-group-btn').addEventListener('click', async () => {
          const name = document.getElementById('new-group-name').value.trim();
          if (!name) { alert('Please enter a group name'); return; }
          try {
            const res = await fetch('/user_access/create_group', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ group_name: name })
            });
            const data = await res.json();
            if (res.ok) {
              alert(data.message);
              document.getElementById('new-group-name').value = '';
              loadGroups();
            } else {
              alert('Error: ' + (data.error || 'Failed to create group'));
            }
          } catch (err) { alert('Failed to create group.'); }
        });
      </script>

      <script>
        let allChallenges = [];

        window.addEventListener('load', loadChallenges);

        async function loadChallenges() {
          try {
            const response = await fetch('/user_access/get_all_challenges', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({})
            });
            allChallenges = await response.json();
            renderChallenges();
          } catch (error) {
            console.error('Failed to load challenges:', error);
            document.getElementById('challenges-list').innerHTML =
              '<tr><td colspan="6" style="text-align: center;">Failed to load challenges</td></tr>';
          }
        }

        function renderChallenges() {
          const tbody = document.getElementById('challenges-list');
          let filtered = allChallenges;

          if (currentFilter === 'current') {
            filtered = allChallenges.filter(c => c.joined);
          } else if (currentFilter === 'join') {
            filtered = allChallenges.filter(c => !c.joined);
          } else if (['personal', 'group', 'history'].includes(currentFilter)) {
            // keep all for now
          }

          if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No challenges found</td></tr>';
            return;
          }

          tbody.innerHTML = '';
          filtered.forEach(challenge => {
            const row = document.createElement('tr');
            const start = new Date(challenge.start_date).toLocaleDateString();
            const end = new Date(challenge.end_date).toLocaleDateString();

            let actionHtml;
            if (challenge.joined) {
              actionHtml = '<span style="color: #1D9E75; font-weight: bold;">Joined</span>';
            } else if (challenge.challenge_type === 'Group') {
              if (challenge.owned_group_id) {
                actionHtml = `<button class="review-button join-group-challenge-btn" data-challenge-id="${challenge.challenge_id}" data-group-id="${challenge.owned_group_id}" style="font-size: 14px; padding: 8px 24px;">Join as Group</button>`;
              } else {
                actionHtml = '<span style="color: #888;">Create/own a group first</span>';
              }
            } else {
              actionHtml = `<button class="review-button join-challenge-btn" data-id="${challenge.challenge_id}" style="font-size: 14px; padding: 8px 24px;">Join</button>`;
            }

            row.innerHTML = `
              <td>${challenge.title}</td>
              <td>${challenge.challenge_type}</td>
              <td>${start}</td>
              <td>${end}</td>
              <td>${challenge.rules || '-'}</td>
              <td>${actionHtml}</td>
            `;
            tbody.appendChild(row);
          });

          document.querySelectorAll('.join-challenge-btn').forEach(btn => {
            btn.addEventListener('click', () => joinChallenge(parseInt(btn.dataset.id)));
          });

          document.querySelectorAll('.join-group-challenge-btn').forEach(btn => {
            btn.addEventListener('click', () => joinGroupChallenge(parseInt(btn.dataset.challengeId), parseInt(btn.dataset.groupId)));
          });
        }

        async function joinChallenge(challengeId) {
          try {
            const response = await fetch('/user_access/join_challenge', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ challenge_id: challengeId })
            });

            const data = await response.json();

            if (response.ok) {
              alert(data.message);
              loadChallenges();
            } else {
              alert('Error: ' + (data.error || 'Failed to join challenge'));
            }
          } catch (error) {
            console.error('Failed to join challenge:', error);
            alert('Failed to join challenge. Please try again.');
          }
        }

        async function joinGroupChallenge(challengeId, groupId) {
          try {
            const response = await fetch('/user_access/join_group_challenge', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ challenge_id: challengeId, group_id: groupId })
            });

            const data = await response.json();

            if (response.ok) {
              alert(data.message);
              loadChallenges();
            } else {
              alert('Error: ' + (data.error || 'Failed to join group challenge'));
            }
          } catch (error) {
            console.error('Failed to join group challenge:', error);
            alert('Failed to join group challenge. Please try again.');
          }
        }
      </script>
    </div>
  </body>
</html>
